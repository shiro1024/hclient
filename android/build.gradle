allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

// Keep legacy Flutter plugins on the same toolchain as the application.
// Otherwise their buildscript blocks resolve obsolete AGP/Kotlin dependency trees.
subprojects {
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.android.tools.build' && details.requested.name == 'gradle') {
                details.useVersion '9.3.1'
            }
            if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name == 'kotlin-gradle-plugin') {
                details.useVersion '2.4.20'
            }
        }
    }
}

// Compile native plugins against the app SDK as well. Older plugins otherwise
// download obsolete SDK platforms and can fail against newer AndroidX libraries.
subprojects {
    afterEvaluate { project ->
        if (project.extensions.findByName("android") != null) {
            project.android.compileSdk = 37
        }
    }
}
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
