name: Build artifacts

on:
  workflow_dispatch:
  push:
    branches: ['master', 'main']
  pull_request:

permissions:
  contents: read

# If previous workflow is still running, we push again, we will cancel the previous workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            artifact_name: build-Android
            artifact_path: build/app/outputs/apk/release/*.apk
          - target: Windows
            os: windows-2022
            artifact_path: build/windows/*.zip
            artifact_name: build-Windows
          # Unsigned IPA for local installation/signing.
          - target: iOS
            os: macos-latest
            cache_pod_key: ios-pods
            cache_pod_path: ios/Pods
            cache_pod_restore_keys_hash_file: ios/Podfile.lock
            artifact_name: build-iOS
            artifact_path: build/**/*.ipa
          - target: macOS
            os: macos-latest
            cache_pod_key: macos-pods
            cache_pod_path: macos/Pods
            cache_pod_restore_keys_hash_file: macos/Podfile.lock
            artifact_name: build-macOS
            artifact_path: ./*.dmg
    runs-on: ${{ matrix.os }}
    env:
      FLUTTER_VERSION: 3.50.0
    steps:
      # Checkout branch
      - name: Checkout
        uses: actions/checkout@v4
      # Select latest stable Xcode (iOS)
      - name: Setup Xcode
        if: matrix.target == 'iOS'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # Output Xcode Version
      - name: Output Xcode Version
        if: matrix.target == 'iOS' || matrix.target == 'macOS'
        run: xcodebuild -version
      # Add Android keystore
      - name: Setup Android keystore
        if: matrix.target == 'Android'
        shell: bash
        env:
          ENCODED_KEYSTORE: ${{ secrets.ENCODED_KEYSTORE }}
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ] && [ -n "$KEY_PROPERTIES" ]; then
            printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
            printf '%s' "$KEY_PROPERTIES" > android/key.properties
          fi
      # Optional JHenTai API secret
      - name: Setup JHenTai API Secret
        shell: bash
        env:
          JH_API_SECRET_CONFIG: ${{ secrets.JH_API_SECRET_CONFIG }}
        run: |
          if [ -n "$JH_API_SECRET_CONFIG" ]; then
            printf '%s' "$JH_API_SECRET_CONFIG" > lib/src/config/jh_api_secret_config.dart
          fi
      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
      - name: Setup Rust
        shell: bash
        run: |
          rust_version=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' native/rust-toolchain.toml)
          rustup toolchain install "$rust_version" --profile minimal
      - name: Test native codec
        if: matrix.target == 'macOS'
        shell: bash
        working-directory: native
        run: cargo test --lib
      # Output Flutter Version
      - name: Output Flutter Version
        run: flutter --version
      # Cache Pod
      - name: Cache Pod
        if: matrix.cache_pod_key != null
        uses: actions/cache@v4
        with:
          key: ${{ matrix.cache_pod_key }}-${{ hashFiles('pubspec.lock', matrix.cache_pod_restore_keys_hash_file) }}
          path: ${{ matrix.cache_pod_path }}
          restore-keys: ${{ matrix.cache_pod_key }}-
      # Setup JDK
      - name: Setup JDK 21 (Android)
        if: matrix.target == 'Android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Accept Android SDK licenses
        if: matrix.target == 'Android'
        shell: bash
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses < <(yes)
      # Flutter Pub Get
      - name: Flutter Pub Get
        run: |
          git config --global core.longpaths true
          flutter pub get
      - name: Run tests
        if: matrix.target == 'macOS'
        run: flutter test
      # Get app version
      - name: Get app version
        id: get_version
        shell: bash
        run: |
          echo "version=$(sed -n 's/^version: //p' pubspec.yaml)" >> "$GITHUB_OUTPUT"
      # Build Android .apk
      - name: Build Android
        if: matrix.target == 'Android'
        run: |
          flutter build apk -t lib/src/main.dart --release --split-per-abi
          cd build/app/outputs/apk/release
          mv app-arm64-v8a-release.apk JHenTai-${{ steps.get_version.outputs.version }}-arm64-v8a.apk
          mv app-armeabi-v7a-release.apk JHenTai-${{ steps.get_version.outputs.version }}-armeabi-v7a.apk
          mv app-x86_64-release.apk JHenTai-${{ steps.get_version.outputs.version }}-x64.apk
      # Build iOS .ipa
      - name: Build iOS
        if: matrix.target == 'iOS'
        run: |
          flutter precache --ios
          flutter build ios -t lib/src/main.dart --release --no-codesign
          sh thin-payload.sh build/ios/iphoneos/*.app
          cd build
          mkdir -p Payload
          mv ios/iphoneos/*.app Payload
          zip -9 JHenTai_${{ steps.get_version.outputs.version }}.ipa -r Payload
      # Build macOS .dmg
      - name: Build macOS
        if: matrix.target == 'macOS'
        run: |
          flutter precache --macos
          sh dmg.sh
      # Build Windows .zip
      - name: Build Windows
        if: matrix.target == 'Windows'
        shell: pwsh
        run: |
          flutter build windows -t lib/src/main.dart --release
          $DestDir = "build\windows\JHenTai_${{ steps.get_version.outputs.version }}"
          $SrcDir = "build\windows\x64\runner\Release"
          New-Item -Path $DestDir -ItemType Directory
          Copy-Item $SrcDir\* -Recurse $DestDir
          Compress-Archive $DestDir build\windows\JHenTai_${{ steps.get_version.outputs.version }}_Windows.zip
      # Upload Artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14
